# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-musl"]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA list)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
